name: "Postil Review"
description: "Low-noise AI review gate: silent on clean PRs, hard gate on real risk. Bring your own model key."
author: "postil-dev"
branding:
  icon: git-pull-request
  color: green

inputs:
  cli-ref:
    description: >-
      Full 40-character commit SHA of postil-dev/postil-cli to install.
      A pinned SHA is required: tags and branches are mutable and this binary
      posts to your pull requests.
    required: true
  cli-release:
    description: >-
      Optional release tag (e.g. v0.1.1) to fetch a prebuilt binary from.
      The release commit must match cli-ref and the artifact checksum must
      verify; otherwise the action falls back to building from cli-ref.
    required: false
    default: ""
  api-key:
    description: "API key for the model endpoint (OpenRouter by default). Postil never proxies inference."
    required: true
  api-base:
    description: "Model endpoint base URL. Defaults to the CLI provider endpoint."
    required: false
    default: ""
  api-format:
    description: "Provider interface: openai-compatible or anthropic."
    required: false
    default: ""
  endpoint-auth-header:
    description: "Additional private-gateway authentication header name. Must be paired with endpoint-auth-value."
    required: false
    default: ""
  endpoint-auth-value:
    description: "Additional private-gateway authentication value. Must be paired with endpoint-auth-header."
    required: false
    default: ""
  allow-private-api-base:
    description: "Permit a local or private-network model endpoint (true/false)."
    required: false
    default: "false"
  model:
    description: "Primary model. Required unless trusted config supplies one."
    required: false
    default: ""
  model-cascade:
    description: "Comma-separated fallback models."
    required: false
    default: ""
  fail-on:
    description: "Fail the job at/above this severity: info | warn | error | never. Defaults to gate.failOn from repo config."
    required: false
    default: ""
  config:
    description: "Explicit config file path (bypasses .postil.yaml discovery)."
    required: false
    default: ""
  pr:
    description: "Pull request number. Defaults to the triggering pull_request event."
    required: false
    default: ""
  since-sha:
    description: "Incremental review: only commits since this SHA."
    required: false
    default: ""
  baseline:
    description: "Path to a previous review envelope for finding reconciliation."
    required: false
    default: ""
  soft-fail:
    description: "Report findings but never fail the job (true/false)."
    required: false
    default: "false"
  sarif-path:
    description: >-
      Optional path to write SARIF 2.1.0 to (for upload via
      github/codeql-action/upload-sarif). Empty disables SARIF output.
    required: false
    default: ""
  github-token:
    description: "Token used to read the PR diff and post review + checks."
    required: false
    default: ${{ github.token }}
  reviewer-ref:
    description: "Deprecated. Use cli-ref."
    required: false
    default: ""

outputs:
  envelope-path:
    description: "Path to the review envelope JSON."
    value: ${{ steps.review.outputs.envelope-path }}
  gate-failing:
    description: "true when gate-level findings exist."
    value: ${{ steps.review.outputs.gate-failing }}
  sarif-path:
    description: "Path to the SARIF file, when sarif-path was set."
    value: ${{ steps.review.outputs.sarif-path }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        CLI_REF: ${{ inputs.cli-ref }}
        DEPRECATED_REF: ${{ inputs.reviewer-ref }}
        API_FORMAT: ${{ inputs.api-format }}
        ENDPOINT_AUTH_HEADER: ${{ inputs.endpoint-auth-header }}
        ENDPOINT_AUTH_VALUE: ${{ inputs.endpoint-auth-value }}
        ALLOW_PRIVATE_API_BASE: ${{ inputs.allow-private-api-base }}
      run: |
        set -euo pipefail
        if [ -n "$DEPRECATED_REF" ]; then
          echo "::error::input 'reviewer-ref' was removed; pin the CLI with 'cli-ref: <40-hex sha of postil-dev/postil-cli>'"
          exit 1
        fi
        if ! printf '%s' "$CLI_REF" | grep -Eq '^[0-9a-f]{40}$'; then
          echo "::error::cli-ref must be a full 40-character lowercase commit SHA, got '$CLI_REF'"
          exit 1
        fi
        case "$API_FORMAT" in
          ""|openai-compatible|anthropic) ;;
          *)
            echo "::error::api-format must be 'openai-compatible' or 'anthropic'"
            exit 1
            ;;
        esac
        if { [ -n "$ENDPOINT_AUTH_HEADER" ] && [ -z "$ENDPOINT_AUTH_VALUE" ]; } \
          || { [ -z "$ENDPOINT_AUTH_HEADER" ] && [ -n "$ENDPOINT_AUTH_VALUE" ]; }; then
          echo "::error::endpoint-auth-header and endpoint-auth-value must be set together"
          exit 1
        fi
        case "$ALLOW_PRIVATE_API_BASE" in
          true|false) ;;
          *)
            echo "::error::allow-private-api-base must be 'true' or 'false'"
            exit 1
            ;;
        esac

    - name: Install cosign
      if: inputs.cli-release != ''
      uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

    - name: Select postil target
      id: target
      shell: bash
      run: |
        set -euo pipefail

        target=""
        if [ "$RUNNER_OS" = "Linux" ]; then
          libc="gnu"
          if command -v ldd >/dev/null 2>&1; then
            ldd_output="$(ldd --version 2>&1 || ldd /bin/sh 2>&1 || true)"
            if printf '%s\n' "$ldd_output" | grep -qi musl; then
              libc="musl"
            fi
          elif { compgen -G "/lib/ld-musl-*.so.1" >/dev/null \
            || compgen -G "/usr/lib/ld-musl-*.so.1" >/dev/null; }; then
            libc="musl"
          fi

          case "$(uname -m)" in
            x86_64) target="x86_64-unknown-linux-$libc" ;;
            aarch64|arm64) target="aarch64-unknown-linux-$libc" ;;
          esac
        fi

        if [ -n "$target" ]; then
          echo "Selected postil target $target"
        else
          echo "::notice::no prebuilt target for $RUNNER_OS/$(uname -m); falling back to source build"
        fi
        echo "target=$target" >> "$GITHUB_OUTPUT"

    - name: Install postil
      shell: bash
      env:
        CLI_REF: ${{ inputs.cli-ref }}
        CLI_RELEASE: ${{ inputs.cli-release }}
        GH_TOKEN: ${{ inputs.github-token }}
        POSTIL_TARGET: ${{ steps.target.outputs.target }}
      run: |
        set -euo pipefail
        DEST="$RUNNER_TEMP/postil-bin"
        mkdir -p "$DEST"

        prebuilt_ok=false
        if [ -n "$CLI_RELEASE" ]; then
          echo "Trying prebuilt binary from release $CLI_RELEASE"
          api="https://api.github.com/repos/postil-dev/postil-cli"
          # The release must point at the pinned commit; refuse a mismatched tag.
          # Auth header goes through a curl config file, not argv, so the
          # token never shows up in `ps`/`/proc/<pid>/cmdline` on the runner.
          auth_cfg="$RUNNER_TEMP/postil-gh-auth.curlrc"
          (umask 077; printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" > "$auth_cfg")
          trap 'rm -f "$auth_cfg"' EXIT
          tag_sha=$(curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 -K "$auth_cfg" \
            "$api/commits/$CLI_RELEASE" | jq -r '.sha' || echo "")
          rm -f "$auth_cfg"
          trap - EXIT
          if [ "$tag_sha" = "$CLI_REF" ]; then
            # Prebuilt artifacts are Linux-only here; other runners fall back
            # to the source build rather than fetching a binary that cannot run.
            target="$POSTIL_TARGET"
            if [ -n "$target" ]; then
              base="https://github.com/postil-dev/postil-cli/releases/download/$CLI_RELEASE"
              if curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 -o "$DEST/postil.tar.gz" "$base/postil-$target.tar.gz" \
                 && curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 -o "$DEST/postil.tar.gz.sha256" "$base/postil-$target.tar.gz.sha256" \
                 && curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 -o "$DEST/postil.tar.gz.sig" "$base/postil-$target.tar.gz.sig" \
                 && curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 -o "$DEST/postil.tar.gz.pem" "$base/postil-$target.tar.gz.pem"; then
                expected=$(awk '{print $1}' "$DEST/postil.tar.gz.sha256")
                actual=$(sha256sum "$DEST/postil.tar.gz" | awk '{print $1}')
                # Checksum guards against transit corruption; the checksum file
                # sits next to the artifact on the same release, so it alone
                # cannot prove the release wasn't tampered with. The Sigstore
                # signature is tied to the specific release.yml workflow run
                # via keyless OIDC, which a same-origin checksum can't fake.
                if [ "$expected" = "$actual" ] && cosign verify-blob \
                    "$DEST/postil.tar.gz" \
                    --signature "$DEST/postil.tar.gz.sig" \
                    --certificate "$DEST/postil.tar.gz.pem" \
                    --certificate-identity "https://github.com/postil-dev/postil-cli/.github/workflows/release.yml@refs/tags/$CLI_RELEASE" \
                    --certificate-oidc-issuer https://token.actions.githubusercontent.com; then
                  tar -xzf "$DEST/postil.tar.gz" -C "$DEST"
                  chmod +x "$DEST/postil"
                  prebuilt_ok=true
                else
                  echo "::warning::release artifact checksum or signature verification failed; falling back to source build"
                fi
              else
                echo "::warning::no prebuilt artifact (or signature) for $target on $CLI_RELEASE; falling back to source build"
              fi
            fi
          else
            echo "::warning::release $CLI_RELEASE points at ${tag_sha:-unknown}, not cli-ref $CLI_REF; falling back to source build"
          fi
        fi

        if [ "$prebuilt_ok" = false ]; then
          echo "Building postil from postil-dev/postil-cli@$CLI_REF"
          verify_repo="$RUNNER_TEMP/postil-cli-signature"
          rm -rf "$verify_repo"
          git init -q "$verify_repo"
          if ! git -C "$verify_repo" fetch --quiet --depth=1 https://github.com/postil-dev/postil-cli "$CLI_REF"; then
            echo "::error::failed to fetch postil-cli commit $CLI_REF for signature verification"
            exit 1
          fi
          # Source builds accept only commits signed by the Postil maintainer
          # or GitHub's web-flow key used for protected squash merges.
          set +e
          verify_output=$(git -C "$verify_repo" verify-commit --raw "$CLI_REF" 2>&1)
          verify_status=$?
          set -e
          if [ "$verify_status" -ne 0 ]; then
            echo "::error::postil-cli commit $CLI_REF is not signed by a trusted key, or git cannot access the signer's public key. Import the signer's public key before using source builds."
            exit 1
          fi
          signer_fingerprint=$(printf '%s\n' "$verify_output" | awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" { print $3; exit }')
          case "$signer_fingerprint" in
            02E45A9532C85D4432AA048151A8809EA950397A|968479A1AFF927E37D1A566BB5690EEEBB952194) ;;
            *)
              echo "::error::postil-cli commit $CLI_REF has a valid signature from an untrusted signer"
              exit 1
              ;;
          esac
          if ! command -v cargo >/dev/null 2>&1; then
            curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
          fi
          cargo install --quiet --git https://github.com/postil-dev/postil-cli \
            --rev "$CLI_REF" --locked --root "$DEST" postil-cli
          # cargo install --root puts the binary in bin/.
          mv "$DEST/bin/postil" "$DEST/postil"
        fi

        echo "$DEST" >> "$GITHUB_PATH"
        "$DEST/postil" --version

    - name: Review
      id: review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        POSTIL_API_KEY: ${{ inputs.api-key }}
        POSTIL_API_BASE: ${{ inputs.api-base }}
        POSTIL_API_FORMAT: ${{ inputs.api-format }}
        POSTIL_ENDPOINT_AUTH_HEADER: ${{ inputs.endpoint-auth-header }}
        POSTIL_ENDPOINT_AUTH_VALUE: ${{ inputs.endpoint-auth-value }}
        POSTIL_ALLOW_PRIVATE_API_BASE: ${{ inputs.allow-private-api-base }}
        REVIEW_MODEL: ${{ inputs.model }}
        REVIEW_MODEL_CASCADE: ${{ inputs.model-cascade }}
        INPUT_PR: ${{ inputs.pr }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_SINCE_SHA: ${{ inputs.since-sha }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_SOFT_FAIL: ${{ inputs.soft-fail }}
        INPUT_SARIF_PATH: ${{ inputs.sarif-path }}
        EVENT_PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        # A set-but-empty key must not shadow a job-level OPENROUTER_API_KEY.
        [ -z "${POSTIL_API_KEY:-}" ] && unset POSTIL_API_KEY
        PR="${INPUT_PR:-$EVENT_PR}"
        if [ -z "$PR" ]; then
          echo "::error::no pull request number: pass 'pr' or run on a pull_request event"
          exit 1
        fi
        ENVELOPE="$RUNNER_TEMP/postil-envelope.json"
        args=(review --bounded --repo "$GITHUB_REPOSITORY" --pr "$PR" --output-json)
        [ -n "$INPUT_FAIL_ON" ]   && args+=(--fail-on "$INPUT_FAIL_ON")
        [ -n "$INPUT_CONFIG" ]    && args+=(--config "$INPUT_CONFIG")
        [ -n "$INPUT_SINCE_SHA" ] && args+=(--since-sha "$INPUT_SINCE_SHA")
        [ -n "$INPUT_BASELINE" ]  && args+=(--baseline "$INPUT_BASELINE")
        [ -n "$INPUT_SARIF_PATH" ] && args+=(--sarif "$INPUT_SARIF_PATH")

        set +e
        postil "${args[@]}" > "$ENVELOPE"
        code=$?
        set -e

        # Fail closed on every outcome except clean (0) and gate-failing (1):
        # a panic (101), timeout (124), or OOM kill (137) must never read as
        # a pass.
        if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
          echo "::error::postil review did not complete (exit $code)"
          exit "$code"
        fi
        if ! gate=$(jq -er 'if (.gate.failing | type) == "boolean" then (.gate.failing | tostring) else error("gate.failing must be boolean") end' "$ENVELOPE" 2>/dev/null); then
          echo "::error::postil review returned an invalid envelope"
          exit 2
        fi
        if { [ "$code" -eq 0 ] && [ "$gate" != false ]; } \
          || { [ "$code" -eq 1 ] && [ "$gate" != true ]; }; then
          echo "::error::postil review exit status and gate verdict disagree"
          exit 2
        fi

        echo "envelope-path=$ENVELOPE" >> "$GITHUB_OUTPUT"
        # Only advertise SARIF that was actually written; a crashed run may
        # have died before producing it.
        [ -n "$INPUT_SARIF_PATH" ] && [ -f "$INPUT_SARIF_PATH" ] \
          && echo "sarif-path=$INPUT_SARIF_PATH" >> "$GITHUB_OUTPUT"
        echo "gate-failing=$gate" >> "$GITHUB_OUTPUT"

        if [ "$code" -eq 1 ] && [ "$INPUT_SOFT_FAIL" != "true" ]; then
          echo "::error::postil gate is failing (see the postil/gate check for details)"
          exit 1
        fi
