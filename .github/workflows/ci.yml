name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: actionlint (workflow files)
        run: actionlint -color
      - name: Validate action.yml structure
        shell: bash
        run: |
          set -euo pipefail
          # actionlint does not validate action.yml itself, only workflow
          # files, so check the composite action's structure separately:
          # it must parse as YAML and carry the fields every consumer and
          # the GitHub Actions runner require.
          python3 - <<'PY'
          import sys
          import yaml

          with open("action.yml") as f:
              doc = yaml.safe_load(f)

          errors = []
          for field in ("name", "description", "runs"):
              if field not in doc:
                  errors.append(f"missing required top-level field: {field}")

          runs = doc.get("runs", {})
          if runs.get("using") != "composite":
              errors.append("runs.using must be 'composite'")
          steps = runs.get("steps")
          if not isinstance(steps, list) or not steps:
              errors.append("runs.steps must be a non-empty list")
          else:
              for i, step in enumerate(steps):
                  if "run" in step and "shell" not in step:
                      errors.append(f"steps[{i}] has 'run' but no 'shell'")

          review_steps = [step for step in (steps or []) if step.get("name") == "Review"]
          if len(review_steps) != 1:
              errors.append("runs.steps must contain exactly one Review step")
          else:
              review_script = review_steps[0].get("run", "")
              for argument in ("--publish", "--bounded", "--sha", "--base-sha", "--output-json"):
                  if argument not in review_script:
                      errors.append(f"Review step must pass {argument}")

          for name, spec in (doc.get("inputs") or {}).items():
              if spec.get("required") and "default" in spec:
                  errors.append(f"input '{name}' is required but also sets a default")

          if errors:
              print("action.yml validation failed:", file=sys.stderr)
              for e in errors:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(1)
          print("action.yml: OK ({} inputs, {} outputs, {} steps)".format(
              len(doc.get("inputs") or {}), len(doc.get("outputs") or {}), len(steps)))
          PY

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: "Extract run: blocks from action.yml"
        # python3 + PyYAML ship on the runner image and are already used by
        # the validate job; no extra tool install needed here.
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/action-scripts"
          python3 - <<'PY'
          import os
          import re
          import sys
          import yaml

          with open("action.yml") as f:
              doc = yaml.safe_load(f)

          outdir = os.path.join(os.environ["RUNNER_TEMP"], "action-scripts")
          for i, step in enumerate(doc["runs"]["steps"]):
              script = step.get("run")
              if not script:
                  continue
              if step.get("shell") != "bash":
                  print(
                      f"::error::step {i} uses shell '{step.get('shell')}', "
                      "expected 'bash' (shellcheck extraction assumes bash)"
                  )
                  sys.exit(1)
              slug = re.sub(r"[^a-zA-Z0-9]", "-", step.get("name", f"step-{i}"))
              with open(os.path.join(outdir, f"{i}-{slug}.sh"), "w") as out:
                  out.write("#!/usr/bin/env bash\n")
                  out.write(script if script.endswith("\n") else script + "\n")
          PY
          ls -la "$RUNNER_TEMP/action-scripts"
      - name: shellcheck
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=("$RUNNER_TEMP"/action-scripts/*.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "::error::no run: blocks extracted from action.yml"
            exit 1
          fi
          # SC1091: the install step sources ~/.cargo/env, a file that only
          # exists after rustup runs earlier in that same script. Nothing to
          # follow at lint time; not a real finding.
          shellcheck --shell=bash --exclude=SC1091 "${scripts[@]}"

  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Extract composite scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/action-scripts"
          python3 - <<'PY'
          import os
          import re
          import yaml

          with open("action.yml") as source:
              action = yaml.safe_load(source)

          outdir = os.path.join(os.environ["RUNNER_TEMP"], "action-scripts")
          for index, step in enumerate(action["runs"]["steps"]):
              script = step.get("run")
              if not script:
                  continue
              slug = re.sub(r"[^a-zA-Z0-9]", "-", step.get("name", f"step-{index}"))
              path = os.path.join(outdir, f"{index}-{slug}.sh")
              with open(path, "w") as output:
                  output.write(script if script.endswith("\n") else script + "\n")
          PY

      - name: Select prebuilt targets across supported runners
        run: |
          set -euo pipefail
          target_script=("$RUNNER_TEMP"/action-scripts/*-Select-postil-target.sh)
          [ "${#target_script[@]}" -eq 1 ]
          fake_bin="$RUNNER_TEMP/fake-target-bin"
          mkdir -p "$fake_bin"
          cat >"$fake_bin/uname" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$FIXTURE_ARCH"
          SH
          chmod +x "$fake_bin/uname"

          run_case() {
            runner_os="$1"
            architecture="$2"
            expected="$3"
            output="$RUNNER_TEMP/target-$runner_os-$architecture.txt"
            PATH="$fake_bin:$PATH" FIXTURE_ARCH="$architecture" \
              RUNNER_OS="$runner_os" GITHUB_OUTPUT="$output" \
              bash "${target_script[0]}"
            grep -Fx "target=$expected" "$output"
          }

          run_case Linux x86_64 x86_64-unknown-linux-gnu
          run_case Linux arm64 aarch64-unknown-linux-gnu
          run_case macOS x86_64 x86_64-apple-darwin
          run_case macOS arm64 aarch64-apple-darwin

      - name: Reject invalid provider input without exposing credentials
        run: |
          set -euo pipefail
          validate_script=("$RUNNER_TEMP"/action-scripts/*-Validate-inputs.sh)
          [ "${#validate_script[@]}" -eq 1 ]
          CLI_REF=0123456789abcdef0123456789abcdef01234567

          env CLI_REF="$CLI_REF" DEPRECATED_REF='' API_FORMAT='' \
            ENDPOINT_AUTH_HEADER='' ENDPOINT_AUTH_VALUE='' \
            ALLOW_PRIVATE_API_BASE=false bash "${validate_script[0]}"
          env CLI_REF="$CLI_REF" DEPRECATED_REF='' API_FORMAT=anthropic \
            ENDPOINT_AUTH_HEADER=X-Gateway-Token \
            ENDPOINT_AUTH_VALUE=private-value-never-log \
            ALLOW_PRIVATE_API_BASE=true bash "${validate_script[0]}"

          expect_failure() {
            expected="$1"
            shift
            log="$RUNNER_TEMP/validation-error.log"
            set +e
            "$@" >"$log" 2>&1
            status=$?
            set -e
            [ "$status" -ne 0 ]
            grep -F "$expected" "$log"
            if grep -F "private-value-never-log" "$log"; then
              echo "::error::endpoint authentication value appeared in validation output"
              exit 1
            fi
          }

          expect_failure "api-format must be" env \
            CLI_REF="$CLI_REF" DEPRECATED_REF='' API_FORMAT=messages \
            ENDPOINT_AUTH_HEADER='' ENDPOINT_AUTH_VALUE='' \
            ALLOW_PRIVATE_API_BASE=false bash "${validate_script[0]}"
          expect_failure "must be set together" env \
            ENDPOINT_AUTH_HEADER=X-Gateway-Token \
            ENDPOINT_AUTH_VALUE='' \
            CLI_REF="$CLI_REF" DEPRECATED_REF='' API_FORMAT='' \
            ALLOW_PRIVATE_API_BASE=false bash "${validate_script[0]}"
          expect_failure "must be set together" env \
            ENDPOINT_AUTH_HEADER='' \
            ENDPOINT_AUTH_VALUE=private-value-never-log \
            CLI_REF="$CLI_REF" DEPRECATED_REF='' API_FORMAT='' \
            ALLOW_PRIVATE_API_BASE=false bash "${validate_script[0]}"
          expect_failure "allow-private-api-base must be" env \
            CLI_REF="$CLI_REF" DEPRECATED_REF='' API_FORMAT='' \
            ENDPOINT_AUTH_HEADER='' ENDPOINT_AUTH_VALUE='' \
            ALLOW_PRIVATE_API_BASE=1 bash "${validate_script[0]}"

      - name: Preserve the complete envelope and fail closed without a model
        run: |
          set -euo pipefail
          review_script=("$RUNNER_TEMP"/action-scripts/*-Review.sh)
          [ "${#review_script[@]}" -eq 1 ]
          fake_bin="$RUNNER_TEMP/fake-review-bin"
          mkdir -p "$fake_bin"
          cat >"$fake_bin/postil" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$@" >"$ARGS_LOG"
          if [ -z "${REVIEW_MODEL:-}" ] && [ -z "${INPUT_CONFIG:-}" ]; then
            echo "no review model is configured" >&2
            exit 2
          fi
          [ "${POSTIL_API_FORMAT:-}" = "anthropic" ]
          [ "${POSTIL_ENDPOINT_AUTH_HEADER:-}" = "X-Gateway-Token" ]
          [ "${POSTIL_ENDPOINT_AUTH_VALUE:-}" = "fixture-gateway-value" ]
          [ "${POSTIL_ALLOW_PRIVATE_API_BASE:-}" = "true" ]
          cat "$FIXTURE_ENVELOPE"
          exit "${FIXTURE_EXIT:-0}"
          SH
          chmod +x "$fake_bin/postil"

          fixture="$RUNNER_TEMP/envelope-fixture.json"
          cat >"$fixture" <<'JSON'
          {"schemaVersion":"1.0","gate":{"failing":false},"findings":[],"reviewCoverage":{"mode":"bounded","selectedBatches":5,"totalBatches":17,"plannerFallback":true,"nested":{"retained":[1,2,3]}}}
          JSON

          output="$RUNNER_TEMP/review-outputs.txt"
          args_log="$RUNNER_TEMP/review-args.txt"
          review_temp="$RUNNER_TEMP/review-success"
          mkdir -p "$review_temp"
          PATH="$fake_bin:$PATH" \
          RUNNER_TEMP="$review_temp" GITHUB_OUTPUT="$output" \
          GITHUB_REPOSITORY=postil-dev/postil-action GITHUB_TOKEN=test-token \
          POSTIL_API_KEY=test-key POSTIL_API_BASE=https://provider.example/v1 \
          POSTIL_API_FORMAT=anthropic POSTIL_ENDPOINT_AUTH_HEADER=X-Gateway-Token \
          POSTIL_ENDPOINT_AUTH_VALUE=fixture-gateway-value \
          POSTIL_ALLOW_PRIVATE_API_BASE=true REVIEW_MODEL=qualified/model \
          REVIEW_MODEL_CASCADE='' INPUT_PR=7 INPUT_FAIL_ON='' INPUT_CONFIG='' \
          INPUT_SINCE_SHA='' INPUT_BASELINE='' INPUT_SOFT_FAIL=false \
          INPUT_SARIF_PATH='' EVENT_PR='' FIXTURE_ENVELOPE="$fixture" ARGS_LOG="$args_log" \
            bash "${review_script[0]}"
          envelope_path=$(awk -F= '$1 == "envelope-path" { print substr($0, index($0, "=") + 1) }' "$output")
          cmp "$fixture" "$envelope_path"
          jq -e '.reviewCoverage == {mode:"bounded",selectedBatches:5,totalBatches:17,plannerFallback:true,nested:{retained:[1,2,3]}}' "$envelope_path"
          grep -Fx -- '--publish' "$args_log"
          grep -Fx -- '--bounded' "$args_log"

          config_temp="$RUNNER_TEMP/review-config"
          config_output="$RUNNER_TEMP/config-outputs.txt"
          config_args="$RUNNER_TEMP/config-args.txt"
          mkdir -p "$config_temp"
          PATH="$fake_bin:$PATH" \
          RUNNER_TEMP="$config_temp" GITHUB_OUTPUT="$config_output" \
          GITHUB_REPOSITORY=postil-dev/postil-action GITHUB_TOKEN=test-token \
          POSTIL_API_KEY=test-key POSTIL_API_BASE=https://provider.example/v1 \
          POSTIL_API_FORMAT=anthropic POSTIL_ENDPOINT_AUTH_HEADER=X-Gateway-Token \
          POSTIL_ENDPOINT_AUTH_VALUE=fixture-gateway-value \
          POSTIL_ALLOW_PRIVATE_API_BASE=true REVIEW_MODEL='' \
          REVIEW_MODEL_CASCADE='' INPUT_PR=7 INPUT_FAIL_ON='' \
          INPUT_CONFIG=postil.toml INPUT_SINCE_SHA='' INPUT_BASELINE='' \
          INPUT_SOFT_FAIL=false INPUT_SARIF_PATH='' EVENT_PR='' \
          FIXTURE_ENVELOPE="$fixture" ARGS_LOG="$config_args" \
            bash "${review_script[0]}"
          grep -Fx -- '--publish' "$config_args"
          grep -Fx -- '--bounded' "$config_args"
          grep -Fx -- '--config' "$config_args"
          grep -Fx -- 'postil.toml' "$config_args"

          expect_envelope_failure() {
            failure_fixture="$1"
            case_name="$2"
            fixture_exit="$3"
            expected_error="$4"
            case_temp="$RUNNER_TEMP/review-invalid-$case_name"
            case_output="$RUNNER_TEMP/invalid-$case_name-outputs.txt"
            case_args="$RUNNER_TEMP/invalid-$case_name-args.txt"
            case_log="$RUNNER_TEMP/invalid-$case_name.log"
            mkdir -p "$case_temp"
            set +e
            PATH="$fake_bin:$PATH" \
            RUNNER_TEMP="$case_temp" GITHUB_OUTPUT="$case_output" \
            GITHUB_REPOSITORY=postil-dev/postil-action GITHUB_TOKEN=test-token \
            POSTIL_API_KEY=test-key POSTIL_API_BASE=https://provider.example/v1 \
            POSTIL_API_FORMAT=anthropic POSTIL_ENDPOINT_AUTH_HEADER=X-Gateway-Token \
            POSTIL_ENDPOINT_AUTH_VALUE=fixture-gateway-value \
            POSTIL_ALLOW_PRIVATE_API_BASE=true REVIEW_MODEL=qualified/model \
            REVIEW_MODEL_CASCADE='' INPUT_PR=7 INPUT_FAIL_ON='' INPUT_CONFIG='' \
            INPUT_SINCE_SHA='' INPUT_BASELINE='' INPUT_SOFT_FAIL=false \
            INPUT_SARIF_PATH='' EVENT_PR='' FIXTURE_ENVELOPE="$failure_fixture" \
            FIXTURE_EXIT="$fixture_exit" ARGS_LOG="$case_args" \
              bash "${review_script[0]}" >"$case_log" 2>&1
            case_status=$?
            set -e
            [ "$case_status" -eq 2 ]
            grep -F "$expected_error" "$case_log"
            [ ! -s "$case_output" ]
          }

          invalid_json="$RUNNER_TEMP/invalid-json.txt"
          missing_gate="$RUNNER_TEMP/missing-gate.json"
          string_gate="$RUNNER_TEMP/string-gate.json"
          number_gate="$RUNNER_TEMP/number-gate.json"
          true_gate="$RUNNER_TEMP/true-gate.json"
          printf 'not json\n' >"$invalid_json"
          printf '{"schemaVersion":"1.0","findings":[]}\n' >"$missing_gate"
          printf '{"gate":{"failing":"false"}}\n' >"$string_gate"
          printf '{"gate":{"failing":0}}\n' >"$number_gate"
          printf '{"gate":{"failing":true}}\n' >"$true_gate"
          expect_envelope_failure "$invalid_json" json 0 "postil review returned an invalid envelope"
          expect_envelope_failure "$missing_gate" missing-gate 0 "postil review returned an invalid envelope"
          expect_envelope_failure "$string_gate" string-gate 0 "postil review returned an invalid envelope"
          expect_envelope_failure "$number_gate" number-gate 0 "postil review returned an invalid envelope"
          expect_envelope_failure "$true_gate" clean-exit-failing-gate 0 "postil review exit status and gate verdict disagree"
          expect_envelope_failure "$fixture" failing-exit-clean-gate 1 "postil review exit status and gate verdict disagree"

          no_model_temp="$RUNNER_TEMP/review-no-model"
          no_model_output="$RUNNER_TEMP/no-model-outputs.txt"
          no_model_args="$RUNNER_TEMP/no-model-args.txt"
          no_model_log="$RUNNER_TEMP/no-model.log"
          mkdir -p "$no_model_temp"
          set +e
          PATH="$fake_bin:$PATH" \
          RUNNER_TEMP="$no_model_temp" GITHUB_OUTPUT="$no_model_output" \
          GITHUB_REPOSITORY=postil-dev/postil-action GITHUB_TOKEN=test-token \
          POSTIL_API_KEY=test-key POSTIL_API_BASE=https://provider.example/v1 \
          POSTIL_API_FORMAT=openai-compatible POSTIL_ENDPOINT_AUTH_HEADER='' \
          POSTIL_ENDPOINT_AUTH_VALUE='' POSTIL_ALLOW_PRIVATE_API_BASE=false \
          REVIEW_MODEL='' REVIEW_MODEL_CASCADE='' INPUT_PR=7 INPUT_FAIL_ON='' \
          INPUT_CONFIG='' INPUT_SINCE_SHA='' INPUT_BASELINE='' INPUT_SOFT_FAIL=false \
          INPUT_SARIF_PATH='' EVENT_PR='' FIXTURE_ENVELOPE="$fixture" \
          ARGS_LOG="$no_model_args" \
            bash "${review_script[0]}" >"$no_model_log" 2>&1
          status=$?
          set -e
          [ "$status" -eq 2 ]
          grep -F "postil review did not complete (exit 2)" "$no_model_log"

      - name: Bind event reviews to the triggering snapshot
        run: |
          set -euo pipefail
          review_script=("$RUNNER_TEMP"/action-scripts/*-Review.sh)
          [ "${#review_script[@]}" -eq 1 ]
          fake_bin="$RUNNER_TEMP/fake-review-bin"
          fixture="$RUNNER_TEMP/envelope-fixture.json"

          run_review() {
            case_name="$1"
            input_pr="$2"
            args_log="$RUNNER_TEMP/$case_name-args.txt"
            case_output="$RUNNER_TEMP/$case_name-outputs.txt"
            case_temp="$RUNNER_TEMP/$case_name"
            mkdir -p "$case_temp"
            PATH="$fake_bin:$PATH" \
            RUNNER_TEMP="$case_temp" GITHUB_OUTPUT="$case_output" \
            GITHUB_REPOSITORY=postil-dev/postil-action GITHUB_TOKEN=test-token \
            POSTIL_API_KEY=test-key POSTIL_API_BASE=https://provider.example/v1 \
            POSTIL_API_FORMAT=anthropic POSTIL_ENDPOINT_AUTH_HEADER=X-Gateway-Token \
            POSTIL_ENDPOINT_AUTH_VALUE=fixture-gateway-value \
            POSTIL_ALLOW_PRIVATE_API_BASE=true REVIEW_MODEL=qualified/model \
            REVIEW_MODEL_CASCADE='' INPUT_PR="$input_pr" INPUT_FAIL_ON='' INPUT_CONFIG='' \
            INPUT_SINCE_SHA='' INPUT_BASELINE='' INPUT_SOFT_FAIL=false \
            INPUT_SARIF_PATH='' EVENT_PR=7 EVENT_HEAD_SHA=head-from-event \
            EVENT_BASE_SHA=base-from-event FIXTURE_ENVELOPE="$fixture" ARGS_LOG="$args_log" \
              bash "${review_script[0]}"
          }

          run_review event-snapshot ''
          snapshot_args="$RUNNER_TEMP/event-snapshot-args.txt"
          grep -Fx -- '--sha' "$snapshot_args"
          grep -Fx -- 'head-from-event' "$snapshot_args"
          grep -Fx -- '--base-sha' "$snapshot_args"
          grep -Fx -- 'base-from-event' "$snapshot_args"

          run_review explicit-pr 8
          explicit_args="$RUNNER_TEMP/explicit-pr-args.txt"
          if grep -Fx -- '--sha' "$explicit_args" || grep -Fx -- '--base-sha' "$explicit_args"; then
            echo "::error::explicit non-event PR inherited the event snapshot"
            exit 1
          fi

      - name: Fall back safely for missing or tampered release bundles
        run: |
          set -euo pipefail
          install_script=("$RUNNER_TEMP"/action-scripts/*-Install-postil.sh)
          [ "${#install_script[@]}" -eq 1 ]
          CLI_REF=0123456789abcdef0123456789abcdef01234567

          run_case() {
            mode="$1"
            case_dir="$RUNNER_TEMP/release-$mode"
            fake_bin="$case_dir/bin"
            mkdir -p "$fake_bin"

            cat >"$fake_bin/curl" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          output=""
          url=""
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -o) output="$2"; shift 2 ;;
              -K|--retry|--retry-delay) shift 2 ;;
              --retry-connrefused|-f|-s|-S|-L|-fsSL) shift ;;
              *) url="$1"; shift ;;
            esac
          done
          if [[ "$url" == *"/commits/"* ]]; then
            printf '{"sha":"%s"}\n' "$CLI_REF"
            exit 0
          fi
          if [ "$RELEASE_TEST_MODE" = "missing" ] && [[ "$url" == *.tar.gz ]]; then
            exit 22
          fi
          mkdir -p "$(dirname "$output")"
          case "$url" in
            *.tar.gz)
              if [ "$RELEASE_TEST_MODE" = "wrong-workflow-sha" ]; then
                archive_dir=$(mktemp -d)
                printf '#!/usr/bin/env bash\nprintf "postil hostile-prebuilt\\n"\n' \
                  >"$archive_dir/postil"
                chmod +x "$archive_dir/postil"
                tar -czf "$output" -C "$archive_dir" postil
                rm -rf "$archive_dir"
              else
                printf 'tampered release bytes' >"$output"
              fi
              ;;
            *.sha256)
              if [ "$RELEASE_TEST_MODE" = "wrong-workflow-sha" ]; then
                sha256sum "$(dirname "$output")/postil.tar.gz" >"$output"
              else
                printf '%064d  postil.tar.gz\n' 0 >"$output"
              fi
              ;;
            *.sig) printf 'invalid signature\n' >"$output" ;;
            *.pem) printf 'invalid certificate\n' >"$output" ;;
            *) exit 22 ;;
          esac
          SH
            cat >"$fake_bin/cosign" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$@" >"$FAKE_COSIGN_LOG"
          if [ "$RELEASE_TEST_MODE" = "wrong-workflow-sha" ]; then
            while [ "$#" -gt 0 ]; do
              if [ "$1" = "--certificate-github-workflow-sha" ] \
                && [ "${2:-}" = "$CLI_REF" ]; then
                exit 1
              fi
              shift
            done
            exit 0
          fi
          exit 1
          SH
            cat >"$fake_bin/git" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$*" >>"$FAKE_GIT_LOG"
          if [[ "$*" == *"verify-commit"* ]]; then
            case "$RELEASE_TEST_MODE" in
              invalid-signature) exit 1 ;;
              zero-validsig) ;;
              trusted-subkey)
                printf '%s\n' '[GNUPG:] VALIDSIG AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA 2026-07-14 0 4 0 1 10 00 02E45A9532C85D4432AA048151A8809EA950397A' >&2
                ;;
              extra-key)
                printf '%s\n' '[GNUPG:] VALIDSIG 1111111111111111111111111111111111111111 2026-07-14 0 4 0 1 10 00 1111111111111111111111111111111111111111' >&2
                ;;
              multiple-validsig)
                printf '%s\n' \
                  '[GNUPG:] VALIDSIG 02E45A9532C85D4432AA048151A8809EA950397A 2026-07-14 0 4 0 1 10 00 02E45A9532C85D4432AA048151A8809EA950397A' \
                  '[GNUPG:] VALIDSIG 1111111111111111111111111111111111111111 2026-07-14 0 4 0 1 10 00 1111111111111111111111111111111111111111' >&2
                ;;
              *)
                printf '%s\n' '[GNUPG:] VALIDSIG 02E45A9532C85D4432AA048151A8809EA950397A 2026-07-14 0 4 0 1 10 00 02E45A9532C85D4432AA048151A8809EA950397A' >&2
                ;;
            esac
          fi
          exit 0
          SH
            cat >"$fake_bin/cargo" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$*" >>"$FAKE_CARGO_LOG"
          root=""
          previous=""
          for argument in "$@"; do
            if [ "$previous" = "--root" ]; then root="$argument"; fi
            previous="$argument"
          done
          mkdir -p "$root/bin"
          cat >"$root/bin/postil" <<'BIN'
          #!/usr/bin/env bash
          printf 'postil test-build\n'
          BIN
          chmod +x "$root/bin/postil"
          SH
            chmod +x "$fake_bin"/*

            mkdir -p "$case_dir/temp"
            : >"$case_dir/github-path"
            : >"$case_dir/git.log"
            : >"$case_dir/cargo.log"
            : >"$case_dir/cosign.log"
            set +e
            PATH="$fake_bin:$PATH" RUNNER_TEMP="$case_dir/temp" RUNNER_OS=Linux \
            GITHUB_PATH="$case_dir/github-path" CLI_REF="$CLI_REF" CLI_RELEASE=v0.7.2 \
            GH_TOKEN=test-token POSTIL_TARGET=x86_64-unknown-linux-gnu \
            RELEASE_TEST_MODE="$mode" FAKE_GIT_LOG="$case_dir/git.log" \
            FAKE_CARGO_LOG="$case_dir/cargo.log" FAKE_COSIGN_LOG="$case_dir/cosign.log" \
              bash "${install_script[0]}" >"$case_dir/output.log" 2>&1
            status=$?
            set -e

            case "$mode" in
            extra-key)
              [ "$status" -ne 0 ]
              grep -F "valid signature from an untrusted primary signer" "$case_dir/output.log"
              [ ! -s "$case_dir/cargo.log" ]
              return
              ;;
            zero-validsig|multiple-validsig)
              [ "$status" -ne 0 ]
              grep -F "did not report exactly one valid primary signing fingerprint" "$case_dir/output.log"
              [ ! -s "$case_dir/cargo.log" ]
              return
              ;;
            invalid-signature)
              [ "$status" -ne 0 ]
              grep -F "is not signed by a trusted key" "$case_dir/output.log"
              [ ! -s "$case_dir/cargo.log" ]
              return
              ;;
            esac

            [ "$status" -eq 0 ]
            grep -F "verify-commit --raw $CLI_REF" "$case_dir/git.log"
            grep -F -- "--rev $CLI_REF" "$case_dir/cargo.log"
            if [ "$mode" = "wrong-workflow-sha" ]; then
              grep -Fx -- '--certificate-github-workflow-sha' "$case_dir/cosign.log"
              grep -Fx -- "$CLI_REF" "$case_dir/cosign.log"
            fi
            if [ "$mode" = "missing" ]; then
              grep -F "no prebuilt artifact (or signature)" "$case_dir/output.log"
            else
              grep -F "checksum or signature verification failed" "$case_dir/output.log"
            fi
          }

          run_case missing
          run_case tampered
          run_case wrong-workflow-sha
          run_case primary-key
          run_case trusted-subkey
          run_case extra-key
          run_case zero-validsig
          run_case multiple-validsig
          run_case invalid-signature

  commit-signature-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Extract production install script
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import yaml

          with open("action.yml") as source:
              action = yaml.safe_load(source)

          install_steps = [
              step for step in action["runs"]["steps"]
              if step.get("name") == "Install postil"
          ]
          if len(install_steps) != 1:
              raise SystemExit("expected exactly one Install postil step")
          path = os.path.join(os.environ["RUNNER_TEMP"], "install-postil.sh")
          with open(path, "w") as output:
              output.write(install_steps[0]["run"])
          PY

      - name: Signed postil-cli source fallback verifies with production policy
        env:
          CLI_REF: dcf4e34c4804d4bf64705ab6367c883cea23b33a # postil-cli v0.7.2
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/postil-gnupg"
          install -m 700 -d "$GNUPGHOME"
          maintainer_key="$RUNNER_TEMP/morgaesis.gpg"
          web_flow_key="$RUNNER_TEMP/web-flow.gpg"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 \
            https://github.com/morgaesis.gpg -o "$maintainer_key"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 \
            https://github.com/web-flow.gpg -o "$web_flow_key"

          maintainer_fingerprints=$(gpg --batch --with-colons \
            --import-options show-only --import "$maintainer_key" \
            | awk -F: '$1 == "fpr" { print $10 }')
          web_flow_fingerprints=$(gpg --batch --with-colons \
            --import-options show-only --import "$web_flow_key" \
            | awk -F: '$1 == "fpr" { print $10 }')
          grep -Fx '02E45A9532C85D4432AA048151A8809EA950397A' \
            <<<"$maintainer_fingerprints"
          grep -Fx '968479A1AFF927E37D1A566BB5690EEEBB952194' \
            <<<"$web_flow_fingerprints"
          gpg --batch --import "$maintainer_key" "$web_flow_key"

          fake_bin="$RUNNER_TEMP/signature-cargo-bin"
          cargo_log="$RUNNER_TEMP/signature-cargo.log"
          github_path="$RUNNER_TEMP/signature-github-path"
          mkdir -p "$fake_bin"
          : >"$cargo_log"
          : >"$github_path"
          cat >"$fake_bin/cargo" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$*" >>"$FAKE_CARGO_LOG"
          root=""
          previous=""
          for argument in "$@"; do
            if [ "$previous" = "--root" ]; then root="$argument"; fi
            previous="$argument"
          done
          mkdir -p "$root/bin"
          cat >"$root/bin/postil" <<'BIN'
          #!/usr/bin/env bash
          printf 'postil signature-test\n'
          BIN
          chmod +x "$root/bin/postil"
          SH
          chmod +x "$fake_bin/cargo"

          PATH="$fake_bin:$PATH" GITHUB_PATH="$github_path" \
          CLI_RELEASE='' GH_TOKEN='' POSTIL_TARGET='' FAKE_CARGO_LOG="$cargo_log" \
            bash "$RUNNER_TEMP/install-postil.sh"
          grep -F -- "--rev $CLI_REF" "$cargo_log"

  # The action has three composite steps: "Validate inputs", "Install
  # postil" (fetch + cosign-verify the pinned CLI, or build from source),
  # and "Review" (the actual LLM call). They are not separable via `uses:`
  # since this is a single composite action with unconditional steps, and
  # calling the action end-to-end would run the "Review" step for real.
  #
  # In a workflow triggered by `pull_request`, github.event.pull_request.number
  # is always populated, so `Review` would resolve a PR number regardless of
  # the `pr` input and go on to call the configured model endpoint with
  # whatever `api-key` we pass. There is no input combination that reliably
  # stops the action before that network call on every trigger this workflow
  # runs on. So instead of invoking the action itself, this job replicates
  # its install/verify path (same commands, same cosign-verifier invocation)
  # and stops there, before anything that would need an LLM API key.
  smoke-install:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            sha256: e3aa51d0147c40281aadf533610f45b7ede3070911d52be723e70b04360935aa
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            sha256: 5e710bf3cec119cfc0d9a6381075e993155eca8eecfa0573e8301a7b194b85fe
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            sha256: 1387159dffc5237e141b62bd16ff30b8a125a2f5ca6f1318d66d6fcb25ee20a4
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            sha256: 80c23018f8988b7cf9bb16a3c0e3ae86d64bc90fcd2bc28ce3c39694948568fb
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            sha256: 4d4e05498eb370b8c83668bad927216c264e2383977e7c1d045281add4a79a3b
          - target: aarch64-apple-darwin
            runner: macos-15
            sha256: 7ceb39a59d60c63fb4df1f6918180d0486fba81f728206a89a28693b13d670b9
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Fetch, cosign-verify, and smoke test the pinned CLI release
        env:
          CLI_REF: dcf4e34c4804d4bf64705ab6367c883cea23b33a # postil-cli v0.7.2
          CLI_RELEASE: v0.7.2
          EXPECTED_VERSION: postil 0.7.2
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/postil-bin"
          mkdir -p "$DEST"
          base="https://github.com/postil-dev/postil-cli/releases/download/$CLI_RELEASE"

          tag_sha=$(gh api "repos/postil-dev/postil-cli/commits/$CLI_RELEASE" --jq .sha)
          [ "$tag_sha" = "$CLI_REF" ]

          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 -o "$DEST/postil.tar.gz" "$base/postil-$TARGET.tar.gz"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 -o "$DEST/postil.tar.gz.sha256" "$base/postil-$TARGET.tar.gz.sha256"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 -o "$DEST/postil.tar.gz.sig" "$base/postil-$TARGET.tar.gz.sig"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 -o "$DEST/postil.tar.gz.pem" "$base/postil-$TARGET.tar.gz.pem"

          checksum_line=$(cat "$DEST/postil.tar.gz.sha256")
          [ "$checksum_line" = "$EXPECTED_SHA256  postil-$TARGET.tar.gz" ]
          expected=$(awk '{print $1}' "$DEST/postil.tar.gz.sha256")
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$DEST/postil.tar.gz" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$DEST/postil.tar.gz" | awk '{print $1}')
          fi
          [ "$expected" = "$actual" ]

          cosign verify-blob \
            "$DEST/postil.tar.gz" \
            --signature "$DEST/postil.tar.gz.sig" \
            --certificate "$DEST/postil.tar.gz.pem" \
            --certificate-identity "https://github.com/postil-dev/postil-cli/.github/workflows/release.yml@refs/tags/$CLI_RELEASE" \
            --certificate-github-workflow-sha "$CLI_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          tar -xzf "$DEST/postil.tar.gz" -C "$DEST"
          chmod +x "$DEST/postil"
          actual_version=$("$DEST/postil" --version)
          [ "$actual_version" = "$EXPECTED_VERSION" ]

          "$DEST/postil" review --help | grep -F -- '--bounded'

          no_model_diff="$DEST/no-model.diff"
          cat >"$no_model_diff" <<'DIFF'
          diff --git a/src/example.rs b/src/example.rs
          new file mode 100644
          --- /dev/null
          +++ b/src/example.rs
          @@ -0,0 +1 @@
          +pub fn example() {}
          DIFF
          set +e
          env -u REVIEW_MODEL -u MODEL_API_KEY -u OPENROUTER_API_KEY \
            POSTIL_IGNORE_REPOSITORY_MODEL_CONFIG=1 \
            "$DEST/postil" review --bounded --diff-file "$no_model_diff" --no-post \
            >"$DEST/no-model.log" 2>&1
          no_model_status=$?
          set -e
          [ "$no_model_status" -eq 2 ]

          config="$DEST/postil.yaml"
          empty_diff="$DEST/empty.diff"
          output="$DEST/config-envelope.json"
          cat >"$config" <<'YAML'
          model:
            name: fixture/not-contacted
          YAML
          : >"$empty_diff"
          POSTIL_API_KEY=unused \
            "$DEST/postil" review --bounded --config "$config" \
            --diff-file "$empty_diff" --no-post --output json --output-file "$output"
          jq -e '.gate.failing == false' "$output"

          # Boundary: this is as far as the smoke test goes. The action's
          # "Review" step, deliberately not exercised here, takes it from
          # here to `postil review --publish --bounded --repo ... --pr ...`, which needs a real
          # PR and a working model API key.
